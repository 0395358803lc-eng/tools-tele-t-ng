[tool.poetry]
name = "telegram-phone-number-checker"
version = "1.3.2"
description = "Local, job-oriented Telegram phone-number checker with durable checkpoints, retry queue, pause/resume and crash recovery."
# NOTE: Personal/private fork. Repository URLs are intentionally omitted so a
# distributed build is not mistaken for the official Bellingcat release. Keep
# the Bellingcat attribution below for the upstream origin.
authors = ["Bellingcat", "Fork maintainer"]
license = "MIT"
readme = "README.md"

[tool.poetry.scripts]
telegram-phone-number-checker = "telegram_phone_number_checker.main:main_entrypoint"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
anyio = "4.15.1"
click = "8.5.0"
exceptiongroup = "1.2.0"
idna = "3.19"
pyaes = "1.6.1"
pyasn1 = "0.6.4"
python-dotenv = "1.2.3"
rsa = "4.9"
sniffio = "1.3.0"
telethon = "1.33.1"
typing-extensions = "4.16.0"
phonenumbers = "9.0.38"
PySocks = { version = "^1.7.1", optional = true }
fastapi = "0.141.1"
starlette = "1.6.0"
uvicorn = "0.52.4"
python-multipart = "0.0.32"
itsdangerous = "2.2.0"
httpx = "0.27.0"
cryptography = "50.0.1"
psycopg = {version = ">=3.1.0", extras = ["binary"]}
openpyxl = "3.1.5"

[tool.poetry.extras]
proxy = ["PySocks"]


[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
httpx = "^0.27.0"
black = "^26.5.1"
isort = "^9.0.1"
PySocks = "^1.7.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = [
  "."
]
asyncio_mode = "auto"

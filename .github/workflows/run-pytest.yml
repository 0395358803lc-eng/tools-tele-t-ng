name: Test Backend and Frontend

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install 'poetry>=2.1,<3'
      - name: Validate lockfile and packaging metadata
        run: poetry check --lock
      - name: Compile Python
        run: python -m compileall -q telegram_phone_number_checker
      - name: Run tests
        run: pytest -q
      - name: Build and inspect clean release
        run: |
          python scripts/build_release.py
          python - <<'PY'
          import zipfile
          from pathlib import Path
          path = Path('dist/telegram-phone-number-checker-release.zip')
          assert path.exists()
          with zipfile.ZipFile(path) as archive:
              names = archive.namelist()
          blocked = [name for name in names if any(part in {'.git','.config','node_modules','__pycache__'} for part in name.split('/')) or name.endswith(('.env','.session','.db','.sqlite','.sqlite3'))]
          assert not blocked, blocked
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check and build frontend
        run: npm run build
